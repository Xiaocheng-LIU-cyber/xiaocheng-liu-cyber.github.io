<rect x="1" y="1" width="1178" height="518" rx="20" fill="#ffffff"/>
<text x="22" y="35" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">STAGE A  ·  Global reconstruction at 128³</text>
