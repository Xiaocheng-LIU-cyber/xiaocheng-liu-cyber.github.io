ll="#64748b">2 × 2 × 2 + pruning</text></g><g><rect x="218" y="327" width="150" height="116" rx="16" fill="#eaf3ff" stroke="#cbd5e1" stroke-width="1.6"/><rect x="228" y="338" width="130" height="7" rx="4" fill="#64748b" opacity=".13"/><text x="293" y="376" text-anchor="middle" font-size="17" font-weight="750" fill="#1f334b">512³</text><text x="293" y="398" text-anchor="middle" font-size="15" font-weight="620" fill="#365371">sparse voxels</text><text x="293" y="424" text-anchor="middle" font-size="11.5" fill="#64748b">Triplane RoI features</text></g><g><rect x="20" y="327" width="150" height="116" rx="16" fill="#edfaf3" stroke="#cbd5e1" stroke-width="1.6"/><rect x="30" y="338" width="130" height="7" rx="4" fill="#64748b" opacity=".13"/><text x="95" y="376" text-anchor="middle" font-size="17" font-weight="750" fill="#1f334b">Sparse</text><text x="95" y="398" text-anchor="middle" font-size="15" font-weight="620" fill="#365371">FlexiCubes</text><text x="95" y="424" text-anchor="middle" font-size="11.5" fill="#64748b">512³ final mesh</text></g>
