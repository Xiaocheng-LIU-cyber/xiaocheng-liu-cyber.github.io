2D feature planes</text></g><g><rect x="812" y="106" width="150" height="116" rx="16" fill="#f4f1fe" stroke="#cbd5e1" stroke-width="1.6"/><rect x="822" y="117" width="130" height="7" rx="4" fill="#64748b" opacity=".13"/><text x="887" y="155" text-anchor="middle" font-size="17" font-weight="750" fill="#1f334b">RoI sampling</text><text x="887" y="177" text-anchor="middle" font-size="15" font-weight="620" fill="#365371">128³ voxels</text><text x="887" y="203" text-anchor="middle" font-size="11.5" fill="#64748b">Dense coarse stage</text></g><g><rect x="1010" y="106" width="150" height="116" rx="16" fill="#fff5e9" stroke="#cbd5e1" stroke-width="1.6"/><rect x="1020" y="117" width="130" height="7" rx="4" fill="#64748b" opacity=".13"/><text x="1085" y="155" text-anchor="middle" font-size="17" font-weight="750" fill="#1f334b">FlexiCubes</text><text x="1085" y="177" text-anchor="middle" font-size="15" font-weight="620" fill="#365371">128³ mesh</text><text x="1085" y="203" text-anchor="middle" font-size="11.5" fill="#64748b">Coarse surface</text></g>
