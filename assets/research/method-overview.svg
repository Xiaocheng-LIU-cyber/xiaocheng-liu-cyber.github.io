<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
<title id="title">Triplane-guided sparse FlexiCubes reconstruction pipeline</title>
<desc id="desc">Single RGB image, diffusion orthographic images and CCMs, U-Net, triplane, ROI sampling at 128 cubed, coarse FlexiCubes mesh, conversion to sparse support, voxel subdivision and pruning through 256 cubed and 512 cubed, and final sparse FlexiCubes mesh.</desc>
