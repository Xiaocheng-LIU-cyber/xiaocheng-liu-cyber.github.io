<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 500" role="img" aria-labelledby="title desc">
<title id="title">Voxel region-of-interest sampling on XY, XZ and YZ feature planes</title>
<desc id="desc">A 3D voxel is projected to rectangular ROIs on each of three orthogonal triplane feature maps and the local feature region is sampled by bilinear interpolation.</desc>
<rect x="0" y="0" width="630" height="500" rx="20" fill="#fff"/>
<g stroke-linejoin="round">
<polygon points="60,170 286,40 290,351 60,469" fill="#ffe7c5" fill-opacity=".72" stroke="#d6a03b" stroke-width="2"/>
<polygon points="286,40 554,40 554,352 290,351" fill="#d8eedd" fill-opacity=".78" stroke="#71ac89" stroke-width="2"/>
<polygon points="60,469 290,351 554,352 333,478" fill="#dceafe" fill-opacity=".9" stroke="#76a8de" stroke-width="2"/>
</g>
<g font-family="Arial,sans-serif" font-size="21" font-weight="750" fill="#465972">
<text x="95" y="156">XZ</text>
<text x="507" y="78">YZ</text>
<text x="342" y="451">XY</text>
</g>
<!-- Central 3D voxel -->
<g stroke="#203145" stroke-width="2.3" fill="#ffffff">
<polygon points="246,240 303,211 353,239 295,268"/>
<polygon points="246,240 295,268 295,336 246,306" fill="#f3f7fb"/>
<polygon points="295,268 353,239 353,306 295,336" fill="#e5edf7"/>
</g>
<!-- Projected regions -->
<g fill="#fff" fill-opacity=".95" stroke="#334155" stroke-width="2">
<polygon points="156,248 200,221 200,279 156,306"/>
<polygon points="425,161 474,161 474,214 425,214"/>
<polygon points="282,392 326,370 374,387 329,409"/>
</g>
<g stroke="#334155" stroke-width="1.8" stroke-dasharray="5 6" fill="none" opacity=".8">
<path d="M246 240 L156 248 M246 306 L156 306 M303 211 L200 221 M295 336 L200 279"/>
<path d="M303 211 L425 161 M353 239 L474 161 M353 306 L474 214 M295 268 L425 214"/>
<path d="M246 306 L282 392 M295 336 L326 370 M353 306 L374 387 M295 268 L329 409"/>
</g>
<g font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#365371">
<text x="230" y="199">Candidate voxel</text>
<text x="102" y="331">Projected RoI</text>
<text x="416" y="237">Projected RoI</text>
<text x="306" y="429">Projected RoI</text>
</g>
</svg>